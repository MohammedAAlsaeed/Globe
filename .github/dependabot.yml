# Weekly update pull requests into develop, grouped so they stay few:
# minor and patch updates together, each major one on its own.
# Security fixes come as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      web-app:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      api:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
